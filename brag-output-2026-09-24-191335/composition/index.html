        tl.to("#root", { x: 0, duration: 0.03, ease: "none" }, t + 0.109);

      function softCut(t) {
        tl.set("#flash", { opacity: 0.35 }, t);
        tl.to("#flash", { opacity: 0, duration: 0.05, ease: "power2.out" }, t + 0.008);
        tl.set("#flash-r", { opacity: 0.25 }, t);
        tl.to("#flash-r", { opacity: 0, duration: 0.06 }, t + 0.015);

      // real-footage cut: plain opacity fade-in, held perfectly still at native scale (no zoom — any

      function showShot(sel, t) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, t);
      }
      function hideShot(sel, t) {
        tl.to(sel, { opacity: 0, duration: 0.06 }, t);
      }
      // instant, zero-effect swap — used only for the intake form sequence
      function cutShot(sel, t) {
        tl.set(sel, { opacity: 1 }, t);
      }
      function cutHideShot(sel, t) {
        tl.set(sel, { opacity: 0 }, t);
      }
      function pulse(sel, t) {
        tl.to(sel, { scale: 1.045, duration: 0.07, ease: "power2.out" }, t)
